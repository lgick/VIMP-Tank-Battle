name: Lint & Test

# запуск на каждый push и pull request
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Run tests
        run: npm test

      # сборка ловит битые импорты и недоступные экспорты, которых не видят
      # ни eslint, ни vitest (vite-node не линкует именованные экспорты строго)
      # audio:process не нужен - он требует ffmpeg
      - name: Build client
        run: npx vite build
